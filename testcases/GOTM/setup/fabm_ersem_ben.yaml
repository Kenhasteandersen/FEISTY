# GOTM-ERSEM-FEISTY test case (setup/fabm_ersem_ben.yaml, run with gotm gotm_ersem_ben.yaml): ERSEM 15.06 L4 with full benthic model, low basal mortality of the fish prey
# North Sea station 56.43N 6.55E (41 m). See testcases/GOTM/README.md for FABM-FEISTY and how its fabm.yaml section is set up.
#
# Differences from the standard ERSEM 15.06 benthic set-up: basal mortality sd = 1e-4 d-1 (ERSEM defaults 0.05, 0.001, 0.01) for the
# zooplankton (Z4, Z5) and benthic fauna (Y2, Y3, Y4) that FEISTY eats, and meiofauna Y4 added as third benthic prey.
#
# FEISTY coupling (instance "fish"):
#  - zooplankton prey: microzooplankton Z5 = small (zoo_size1: s), mesozooplankton Z4 = large (zoo_size2: l)
#  - benthic prey: deposit feeders Y2, suspension feeders Y3, meiofauna Y4 (internal_benthos: false, n_ben: 3)
#  - respiration to DIC (O3), ammonium (N4) and phosphate (N1); feces and carcasses to large POM (R8), as c, n and p
#  - stoichiometry: FEISTY Redfield 106:16:1 (qnc, qpc); differences with prey stoichiometry are excreted
#
# Every line below was written by FABM (pyfabm save_settings) and carries the registered long name,
# [units; bounds; default]. Settings without "default" in their comment have no default and must be given.
check_conservation: true                                      # add diagnostics for the rate of change of conserved quantities [default=false]
require_initialization: false                                 # allow state variables without an explicit initial value to start from their default [default=true]
instances:
   zenithAngle:
      model: ersem/zenith_angle                               # model type [default=zenithAngle]
   light:
      model: ersem/light_iop                                  # model type [default=light]
      parameters:
         a0w: 0.03                                            # absorption coefficient of clear water [1/m; default=0.036]
         b0w: 0.0015                                          # backscatter coefficient of clear water [1/m; default=1.60000000E-03]
         pEIR_eow: 0.5                                        # photosynthetically active fraction of shortwave radiation [dimensionless; default=0.5]
   N1:
      model: ersem/pelagic_base                               # model type [default=N1]
      long_name: phosphate                                    # descriptive name for model instance [default=N1]
      parameters:
         composition: p                                       # elemental composition
         c0: 0.001                                            # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         p: 0.4                                               # phosphorus [mmol P/m^3; min=0.0; default=0.0]
   N3:
      model: ersem/pelagic_base                               # model type [default=N3]
      long_name: nitrate                                      # descriptive name for model instance [default=N3]
      parameters:
         composition: n                                       # elemental composition
         c0: 0.001                                            # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         n: 8.0                                               # nitrogen [mmol N/m^3; min=0.0; default=0.0]
   N4:
      model: ersem/pelagic_base                               # model type [default=N4]
      long_name: ammonium                                     # descriptive name for model instance [default=N4]
      parameters:
         composition: n                                       # elemental composition
         c0: 0.001                                            # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         n: 0.1                                               # nitrogen [mmol N/m^3; min=0.0; default=0.0]
   N5:
      model: ersem/pelagic_base                               # model type [default=N5]
      long_name: silicate                                     # descriptive name for model instance [default=N5]
      parameters:
         composition: s                                       # elemental composition
         #c0: 0.0                                              # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
         s0: 0.0003                                           # background silicon concentration [mmol Si/m^3; default=0.0]
      initialization:
         s: 4.5                                               # silicate [mmol Si/m^3; min=0.0; default=0.0]
   O2:
      model: ersem/oxygen                                     # model type [default=O2]
      long_name: oxygen                                       # descriptive name for model instance [default=O2]
      parameters:
         iswO2: 2                                             # saturation formulation (1: legacy ERSEM, 2: Weiss 1970) [min=1; max=2]
         #iswASFLUX: 6                                         # air-sea O2 exchange (0: none, 1: Nightingale et al. 2000, 2: Wanninkhof 1992 without chemical enhancement, 3: Wanninkhof 1992 with chemical enhancement, 4: Wanninkhof and McGillis 1999, 5: Wanninkhof 1992 switching to Wanninkhof and McGillis 1999, 6: Wanninkhof 2014) [default=6]
   O3:
      model: ersem/carbonate                                  # model type [default=O3]
      long_name: carbonate                                    # descriptive name for model instance [default=O3]
      parameters:
         iswCO2: 1                                            # carbonate system diagnostics (0: off, 1: on) [min=0; max=1; default=1]
         iswASFLUX: 1                                         # air-sea CO2 exchange (0: none, 1: Nightingale et al. 2000, 2: Wanninkhof 1992 without chemical enhancement, 3: Wanninkhof 1992 with chemical enhancement, 4: Wanninkhof and McGillis 1999, 5: Wanninkhof 1992 switching to Wanninkhof and McGillis 1999, 6: Wanninkhof 2014) [min=0; max=6; default=6]
         iswtalk: 5                                           # alkalinity formulation (1-4: from salinity and temperature, 5: dynamic alkalinity) [min=1; max=5; default=5]
         pHscale: 1                                           # pH scale (1: total, 0: SWS, -1: SWS backward compatible) [min=-1; max=1; default=1]
      initialization:
         c: 2130.0                                            # total dissolved inorganic carbon [mmol C/m^3; min=0.0; default=2200.0]
   R1:
      model: ersem/pelagic_base                               # model type [default=R1]
      long_name: labile dissolved organic matter              # descriptive name for model instance [default=R1]
      parameters:
         composition: cnp                                     # elemental composition
         c0: 0.0034                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         #iopABS: 0.0                                          # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         #iopBBS: 0.0                                          # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         c: 10.0                                              # carbon [mg C/m^3; min=0.0; default=0.0]
         n: 0.14                                              # nitrogen [mmol N/m^3; min=0.0; default=0.0]
         p: 0.01                                              # phosphorus [mmol P/m^3; min=0.0; default=0.0]
   R2:
      model: ersem/pelagic_base                               # model type [default=R2]
      long_name: semi-labile dissolved organic matter         # descriptive name for model instance [default=R2]
      parameters:
         composition: c                                       # elemental composition
         c0: 0.0033                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         #iopABS: 0.0                                          # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         #iopBBS: 0.0                                          # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         #qn: 0.0                                              # nitrogen : carbon ratio [mmol N/mg C; min=0.0; default=0.0]
         #qp: 0.0                                              # phosphorus : carbon ratio [mmol P/mg C; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         c: 12.0                                              # carbon [mg C/m^3; min=0.0; default=0.0]
   R3:
      model: ersem/pelagic_base                               # model type [default=R3]
      long_name: semi-refractory dissolved organic matter     # descriptive name for model instance [default=R3]
      parameters:
         composition: c                                       # elemental composition
         c0: 0.0033                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         #iopABS: 0.0                                          # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         #iopBBS: 0.0                                          # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         #qn: 0.0                                              # nitrogen : carbon ratio [mmol N/mg C; min=0.0; default=0.0]
         #qp: 0.0                                              # phosphorus : carbon ratio [mmol P/mg C; min=0.0; default=0.0]
         #rm: 0.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
      initialization:
         c: 12.0                                              # carbon [mg C/m^3; min=0.0; default=0.0]
   R4:
      model: ersem/pelagic_base                               # model type [default=R4]
      long_name: small-size pom                               # descriptive name for model instance [default=R4]
      parameters:
         composition: cnpf                                    # elemental composition
         c0: 0.0033                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         iopABS: 1e-05                                        # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         iopBBS: 1.6e-05                                      # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         rm: 1.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
         ndeposition: 2                                       # number of target pools for sedimentation [default=1]
         #vel_crit: 0.01                                       # critical bed shear velocity for deposition [m/s; default=0.01]
         qxc2: 0.1                                            # fraction of carbon sinking into deposition target 2 [dimensionless]
         qxn2: 0.1                                            # fraction of nitrogen sinking into deposition target 2 [dimensionless]
         qxp2: 0.06                                           # fraction of phosphorus sinking into deposition target 2 [dimensionless]
      initialization:
         c: 7.2                                               # carbon [mg C/m^3; min=0.0; default=0.0]
         n: 0.1                                               # nitrogen [mmol N/m^3; min=0.0; default=0.0]
         p: 0.007                                             # phosphorus [mmol P/m^3; min=0.0; default=0.0]
      coupling:
         deposition_target1: Q6/surface                       # deposition_target1
         deposition_target2: Q7/surface                       # deposition_target2
   R6:
      model: ersem/pelagic_base                               # model type [default=R6]
      long_name: medium-size pom                              # descriptive name for model instance [default=R6]
      parameters:
         composition: cnpsf                                   # elemental composition
         c0: 0.0033                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         iopABS: 1e-05                                        # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         iopBBS: 1.6e-05                                      # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         rm: 5.0                                              # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
         ndeposition: 2                                       # number of target pools for sedimentation [default=1]
         #vel_crit: 0.01                                       # critical bed shear velocity for deposition [m/s; default=0.01]
         qxc2: 0.1                                            # fraction of carbon sinking into deposition target 2 [dimensionless]
         qxn2: 0.1                                            # fraction of nitrogen sinking into deposition target 2 [dimensionless]
         qxp2: 0.06                                           # fraction of phosphorus sinking into deposition target 2 [dimensionless]
         #s0: 3.88794548E-05                                   # background silicon concentration [mmol Si/m^3; default=3.88794548E-05]
         qxs2: 0.0                                            # fraction of silicate sinking into deposition target 2 [dimensionless]
      initialization:
         c: 17.0                                              # carbon [mg C/m^3; min=0.0; default=0.0]
         n: 0.24                                              # nitrogen [mmol N/m^3; min=0.0; default=0.0]
         p: 0.02                                              # phosphorus [mmol P/m^3; min=0.0; default=0.0]
         s: 0.1                                               # silicate [mmol Si/m^3; min=0.0; default=0.0]
      coupling:
         deposition_target1: Q6/surface                       # deposition_target1
         deposition_target2: Q7/surface                       # deposition_target2
   R8:
      model: ersem/pelagic_base                               # model type [default=R8]
      long_name: large-size pom                               # descriptive name for model instance [default=R8]
      parameters:
         composition: cnps                                    # elemental composition
         c0: 0.0033                                           # background carbon concentration [mg C/m^3; min=0.0; default=0.0]
         #EPS: 0.0                                             # specific shortwave attenuation [m^2/mg C; min=0.0; default=0.0]
         iopABS: 1e-05                                        # specific shortwave absorption [m^2/mg C; min=0.0; default=0.0]
         iopBBS: 1.6e-05                                      # specific shortwave backscatter [m^2/mg C; min=0.0; default=0.0]
         rm: 10.0                                             # sinking velocity [m/d; default=0.0]
         #k1: 0.0                                              # 1st order kinetic rate [1/d; min=0.0; default=0.0]
         #q10: 1.0                                             # Q_10 temperature coefficient for the 1st order kinetic [dimensionless; min=1.0; default=1.0]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
         ndeposition: 2                                       # number of target pools for sedimentation [default=1]
         #vel_crit: 0.01                                       # critical bed shear velocity for deposition [m/s; default=0.01]
         qxc2: 0.1                                            # fraction of carbon sinking into deposition target 2 [dimensionless]
         qxn2: 0.1                                            # fraction of nitrogen sinking into deposition target 2 [dimensionless]
         qxp2: 0.06                                           # fraction of phosphorus sinking into deposition target 2 [dimensionless]
         #s0: 3.88794548E-05                                   # background silicon concentration [mmol Si/m^3; default=3.88794548E-05]
         qxs2: 0.0                                            # fraction of silicate sinking into deposition target 2 [dimensionless]
      initialization:
         c: 0.17                                              # carbon [mg C/m^3; min=0.0; default=0.0]
         n: 0.0024                                            # nitrogen [mmol N/m^3; min=0.0; default=0.0]
         p: 0.0002                                            # phosphorus [mmol P/m^3; min=0.0; default=0.0]
         s: 0.001                                             # silicate [mmol Si/m^3; min=0.0; default=0.0]
      coupling:
         deposition_target1: Q6/surface                       # deposition_target1
         deposition_target2: Q7/surface                       # deposition_target2
   Q1:
      model: ersem/benthic_base                               # model type [default=Q1]
      long_name: benthic dissolved organic matter             # descriptive name for model instance [default=Q1]
      parameters:
         composition: cnp                                     # elemental composition
         #remin: 0.0                                           # remineralisation rate at 10 degrees Celsius [1/d; default=0.0]
         #resuspension: false                                  # enable resuspension [default=false]
         c0: 0.001                                            # background carbon concentration [mg C/m^2; default=0.0]
      initialization:
         c: 18.9                                              # carbon [mg C/m^2; min=0.0; default=0.0]
         p: 0.0035                                            # phosphorus [mmol P/m^2; min=0.0; default=0.0]
         n: 0.6                                               # nitrogen [mmol N/m^2; min=0.0; default=0.0]
   Q6:
      model: ersem/benthic_column_particulate_matter          # model type [default=Q6]
      long_name: benthic particulate organic matter           # descriptive name for model instance [default=Q6]
      parameters:
         composition: cnpsf                                   # elemental composition
         c0: 0.001                                            # background carbon concentration [mg C/m^2; default=0.0]
         resuspension: true                                   # enable resuspension [default=false]
         #burial: false                                        # enable burial [default=false]
      initialization:
         c: 3052.0                                            # carbon [mg C/m^2; min=0.0; default=0.0]
         p: 0.5                                               # phosphorus [mmol P/m^2; min=0.0; default=0.0]
         n: 3.5                                               # nitrogen [mmol N/m^2; min=0.0; default=0.0]
         s: 149.0                                             # silicate [mmol Si/m^2; min=0.0; default=0.0]
         pen_depth_c: 0.0173                                  # penetration depth of carbon [m; min=0.0; default=0.0]
         pen_depth_n: 0.02                                    # penetration depth of nitrogen [m; min=0.0; default=0.0]
         pen_depth_p: 0.025                                   # penetration depth of phosphorus [m; min=0.0; default=0.0]
         pen_depth_s: 0.0313                                  # penetration depth of silicate [m; min=0.0; default=0.0]
      coupling:
         RP: R6                                               # RP
   Q7:
      model: ersem/benthic_column_particulate_matter          # model type [default=Q7]
      long_name: benthic refractory matter                    # descriptive name for model instance [default=Q7]
      parameters:
         composition: cnp                                     # elemental composition
         c0: 0.001                                            # background carbon concentration [mg C/m^2; default=0.0]
         #resuspension: false                                  # enable resuspension [default=false]
         burial: true                                         # enable burial [default=false]
      initialization:
         c: 30520.0                                           # carbon [mg C/m^2; min=0.0; default=0.0]
         p: 8.0                                               # phosphorus [mmol P/m^2; min=0.0; default=0.0]
         n: 80.0                                              # nitrogen [mmol N/m^2; min=0.0; default=0.0]
         pen_depth_c: 0.2                                     # penetration depth of carbon [m; min=0.0; default=0.0]
         pen_depth_n: 0.25                                    # penetration depth of nitrogen [m; min=0.0; default=0.0]
         pen_depth_p: 0.313                                   # penetration depth of phosphorus [m; min=0.0; default=0.0]
      coupling:
         burial_target: Q17                                   # burial_target
   Q17:
      model: ersem/benthic_base                               # model type [default=Q17]
      long_name: benthic buried matter                        # descriptive name for model instance [default=Q17]
      parameters:
         composition: cnp                                     # elemental composition
         #remin: 0.0                                           # remineralisation rate at 10 degrees Celsius [1/d; default=0.0]
         #resuspension: false                                  # enable resuspension [default=false]
         #c0: 0.0                                              # background carbon concentration [mg C/m^2; default=0.0]
   B1:
      model: ersem/bacteria_docdyn                            # model type [default=B1]
      long_name: bacteria                                     # descriptive name for model instance [default=B1]
      parameters:
         q10: 2.0                                             # Q_10 temperature coefficient [dimensionless]
         chdo: 0.31                                           # Michaelis-Menten constant for oxygen limitation [dimensionless]
         chn: 0.5                                             # Michaelis-Menten constant for nitrate limitation [mmol N/m^3]
         chp: 0.1                                             # Michaelis-Menten constant for phosphate limitation [mmol P/m^3]
         sd: 0.05                                             # specific mortality at reference temperature [1/d]
         sum: 2.2                                             # maximum specific uptake at reference temperature [1/d]
         pu: 0.6                                              # efficiency at high oxygen levels [dimensionless]
         puo: 0.2                                             # efficiency at low oxygen levels [dimensionless]
         srs: 0.1                                             # specific rest respiration at reference temperature [1/d]
         sR1: 1.0                                             # maximum turn-over rate of DOM [1/d; default=1.0]
         qpc: 0.0019                                          # maximum phosphorus to carbon ratio [mmol P/mg C]
         qnc: 0.0167                                          # maximum nitrogen to carbon ratio [mmol N/mg C]
         ur_O2: 0.1                                           # oxygen consumed per carbon respired [mmol O_2/mg C]
         #denit: 0                                             # denitrification switch (0: off, 1: on) [dimensionless; min=0; max=1; default=0]
         sR1N1: 0.0                                           # mineralisation rate of labile dissolved organic phosphorus [1/d]
         sR1N4: 0.0                                           # mineralisation rate of labile dissolved organic nitrogen [1/d]
         fsink: 7e-05                                         # scavenging rate for iron [1/d]
         c0: 0.01                                             # background carbon concentration [mg C/m^3]
         #no_river_dilution: false                             # disable river dilution by setting riverine concentrations equal to those in the receiving grid cell [default=false]
         nRP: 3                                               # number of substrates [default=0]
         sRP1R1: 0.01                                         # remineralisation of substrate 1 to DOM [1/d]
         sRP2R1: 0.0025                                       # remineralisation of substrate 2 to DOM [1/d]
         sRP3R1: 0.001                                        # remineralisation of substrate 3 to DOM [1/d]
         rR2: 0.0075                                          # fraction of semi-labile DOC available to bacteria [dimensionless]
         rR3: 0.0025                                          # fraction of semi-refractory DOC available to bacteria [dimensionless]
         frR3: 0.3                                            # fraction of activity respiration converted to semi-refractory DOC [dimensionless]
      initialization:
         c: 15.7                                              # carbon [mg C/m^3; min=0.0; default=1.00000000E-04]
         n: 0.26                                              # nitrogen [mmol N/m^3; min=0.0; default=1.26000000E-06]
         p: 0.029                                             # phosphorus [mmol P/m^3; min=0.0; default=4.28800000E-08]
      coupling:
         RP1: R4                                              # RP1
         RP2: R6                                              # RP2
         RP3: R8                                              # RP3
         N1p: N1/p                                            # phosphate [mmol P/m^3; default=]
         N4n: N4/n                                            # ammonium [mmol N/m^3; default=]
         R1c: R1/c                                            # labile dissolved organic carbon [mg C/m^3; default=]
         R1p: R1/p                                            # labile dissolved organic phosphorus [mmol P/m^3; default=]
         R1n: R1/n                                            # labile dissolved organic nitrogen [mmol N/m^3; default=]
         R2c: R2/c                                            # semi-labile dissolved organic carbon [mg C/m^3; default=]
         R3c: R3/c                                            # semi-refractory DOC [mg C/m^3; default=]
