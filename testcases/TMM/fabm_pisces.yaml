         etaF_3: 0.05                                             # fraction of lgpel maximum size with 50% fishing selectivity [dimensionless; default=etaF]
         Fmax_4: 0.0                                              # Maximum fishing mortality of bathypel [yr-1; default=Fmax]
         etaF_4: 0.05                                             # fraction of bathypel maximum size with 50% fishing selectivity [dimensionless; default=etaF]
         Fmax_5: 0.0                                              # Maximum fishing mortality of dem [yr-1; default=Fmax]
         etaF_5: 0.05                                             # fraction of dem maximum size with 50% fishing selectivity [dimensionless; default=etaF]
