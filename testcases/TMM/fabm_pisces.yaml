# TMM-FEISTY test case (fabm_pisces.yaml, run with run_pisces.py through fabmos): PISCES with FEISTY's internal benthos.
# Adapted from testcases/GOTM/setup/fabm_pisces.yaml, which was tested in GOTM at a 41 m North Sea station.
# See testcases/GOTM/README.md for FABM-FEISTY and how its fabm.yaml section is set up, and testcases/TMM/readme.md for the TMM runs.
#
# Changes for TMM (everything else is identical to the GOTM file):
#  - fish: max_depth 5000 -> 6000 m. FEISTY pre-computes its look-up tables for n_depth log-spaced water depths from 1 m to max_depth
#    and, in every water column, uses the table closest to the local bottom depth; max_depth must therefore be at least the deepest
#    cell of the TMM grid (about 5.5 km in the MITgcm 2.8deg grid). n_depth (50) is unchanged and must not exceed max_depth.
#  - fish: depth 41 -> 100 m. This value is only used for FEISTY's initial set-up; in the run the tables above are selected
#    from the actual bottom depth of each water column, so it does not need to match the grid.
#  - Inputs that GOTM supplied through fabm: input: in gotm_pisces.yaml are set in run_pisces.py instead
#    (atmospheric CO2 400 ppm).
#    The nutrient profiles that GOTM read from file are not used here: the nutrients start from the uniform "initialization" values below
#    (placeholders: replace them by observed fields, or spin up) and are then transported by TMM.
#  - GOTM relaxed nitrate, phosphate and silicate in the bottom 15 m to observed profiles (nutrient inflow through the sediment-water
#    interface of the 1-D column). TMM has no equivalent; it is not reproduced here.
#
# FEISTY coupling (instance "fish"), without source changes:
#  - zooplankton prey: microzooplankton zoo = small (zoo_size1: s), mesozooplankton mes = large (zoo_size2: l)
#  - PISCES has fixed C:N:P = 122:16:1 and carries N and P implicitly in carbon units, so FEISTY uses the same
#    ratios (qnc = 16/122, qpc = 1/122); carbon-only feces, carcasses and deposition then carry the right N and P
#  - feces and carcasses to small POM (pom); gom is not used because its total carbon includes calcite
#  - respiration to DIC (carbonate), ammonium (nh4) and phosphate (po4)
#  - internal benthos: pom and gom deposit carbon (already mmol C m-2) into fish/det_pool_c (coupling "bc" below);
#    det_flux_n and det_flux_p are coupled to the same carbon flux and scaled by 16/122 and 1/122;
#    the deposition not used by the benthos goes back to the PISCES sediment (det_bot_c: sed/c)
#
# Every line below was written by FABM (pyfabm save_settings) and carries the registered long name,
# [units; bounds; default]. Settings without "default" in their comment have no default and must be given.
check_conservation: true                                          # add diagnostics for the rate of change of conserved quantities [default=false]
require_initialization: false                                     # allow state variables without an explicit initial value to start from their default [default=true]
instances:
   optics:
      model: pisces/optics                                        # model type [default=optics]
      parameters:
         ln_varpar: false                                         # use variable PAR : SWR ratio [default=true]
         #parlux: 0.43                                             # PAR : SWR ratio [dimensionless; default=0.43]
         #rn_si0: 0.35                                             # extinction depth for non-visible radiation (SWR - PAR) [m; default=0.35]
   no3:
      model: pisces/tracer                                        # model type [default=no3]
      long_name: nitrate                                          # descriptive name for model instance [default=no3]
      parameters:
         #has_carbon: false                                        # tracer contains carbon [default=false]
         has_nitrogen: true                                       # tracer contains nitrogen [default=false]
         #has_phosphorus: false                                    # tracer contains phosphorus [default=false]
         #has_silicon: false                                       # tracer contains silicon [default=false]
         #has_iron: false                                          # tracer contains iron [default=false]
      initialization:
         c: 0.0002356125                                          # concentration in carbon units [mol C L-1; min=0.0; default=0.0]
   nh4:
      model: pisces/tracer                                        # model type [default=nh4]
      long_name: ammonium                                         # descriptive name for model instance [default=nh4]
      parameters:
         #has_carbon: false                                        # tracer contains carbon [default=false]
         has_nitrogen: true                                       # tracer contains nitrogen [default=false]
         #has_phosphorus: false                                    # tracer contains phosphorus [default=false]
         #has_silicon: false                                       # tracer contains silicon [default=false]
         #has_iron: false                                          # tracer contains iron [default=false]
      initialization:
         c: 1.e-8                                                 # concentration in carbon units [mol C L-1; min=0.0; default=0.0]
   po4:
      model: pisces/tracer                                        # model type [default=po4]
      long_name: phosphate                                        # descriptive name for model instance [default=po4]
      parameters:
         #has_carbon: false                                        # tracer contains carbon [default=false]
         #has_nitrogen: false                                      # tracer contains nitrogen [default=false]
         has_phosphorus: true                                     # tracer contains phosphorus [default=false]
         #has_silicon: false                                       # tracer contains silicon [default=false]
         #has_iron: false                                          # tracer contains iron [default=false]
      initialization:
         c: 0.00026413                                            # concentration in carbon units [mol C L-1; min=0.0; default=0.0]
   sil:
      model: pisces/tracer                                        # model type [default=sil]
      long_name: silicate                                         # descriptive name for model instance [default=sil]
      parameters:
         #has_carbon: false                                        # tracer contains carbon [default=false]
         #has_nitrogen: false                                      # tracer contains nitrogen [default=false]
         #has_phosphorus: false                                    # tracer contains phosphorus [default=false]
         has_silicon: true                                        # tracer contains silicon [default=false]
         #has_iron: false                                          # tracer contains iron [default=false]
      initialization:
         si: 91.51e-6                                             # concentration in silicon units [mol Si L-1; min=0.0; default=0.0]
   fer:
      model: pisces/tracer                                        # model type [default=fer]
      long_name: iron                                             # descriptive name for model instance [default=fer]
      parameters:
         #has_carbon: false                                        # tracer contains carbon [default=false]
         #has_nitrogen: false                                      # tracer contains nitrogen [default=false]
         #has_phosphorus: false                                    # tracer contains phosphorus [default=false]
         #has_silicon: false                                       # tracer contains silicon [default=false]
         has_iron: true                                           # tracer contains iron [default=false]
      initialization:
         fe: 6.e-10                                               # concentration in iron units [mol Fe L-1; min=0.0; default=0.0]
   dom:
      model: pisces/tracer                                        # model type [default=dom]
      long_name: dissolved organic matter                         # descriptive name for model instance [default=dom]
      parameters:
         has_carbon: true                                         # tracer contains carbon [default=false]
         has_nitrogen: true                                       # tracer contains nitrogen [default=false]
         has_phosphorus: true                                     # tracer contains phosphorus [default=false]
         #has_silicon: false                                       # tracer contains silicon [default=false]
         #has_iron: false                                          # tracer contains iron [default=false]
      initialization:
         c: 1.e-8                                                 # concentration in carbon units [mol C L-1; min=0.0; default=0.0]
   pom:
      model: pisces/pom                                           # model type [default=pom]
      long_name: small particulate organic matter                 # descriptive name for model instance [default=pom]
      parameters:
         #has_silicon: false                                       # particulate tracer contains silica [default=false]
         #has_calcite: false                                       # particulate tracer contains calcite [default=false]
         ws: 2                                                    # minimum sinking velocity [m d-1; default=50.0]
         #wsmax: 2.0                                               # maximum sinking velocity [m d-1; default=2.0]
         #wsscale: 5000.0                                          # length scale of sinking [m; default=5000.0]
         solgoc: 0                                                # fraction broken down to smaller POM [dimensionless; default=1.07868603E-01]
         mlvar: true                                              # lability varies in mixing layer [default=false]
         #xremip: 0.035                                            # remineralisation rate [dimensionless; default=0.035]
         #jcpoc: 15                                                # number of lability classes [default=15]
         #rshape: 1.0                                              # shape of the gamma function [dimensionless; default=1.0]
      initialization:
         c: 1.e-8                                                 # carbon concentration [mol C L-1; min=0.0; default=5.23000000E-08]
         fe: 5.e-14                                               # iron concentration [mol Fe L-1; min=0.0; default=9.84000000E-13]
      coupling:
         bc: fish/det_pool_c                                      # target pool for organic carbon depositon [mmol C m-2; default=]
         fer: fer/fe                                              # iron [mol C L-1; default=]
         sed: sed                                                 # sed
         dom: dom                                                 # dom
   gom:
      model: pisces/pom                                           # model type [default=gom]
      long_name: large particulate organic matter                 # descriptive name for model instance [default=gom]
      parameters:
         has_silicon: true                                        # particulate tracer contains silica [default=false]
         has_calcite: true                                        # particulate tracer contains calcite [default=false]
         ws: 50                                                   # minimum sinking velocity [m d-1; default=50.0]
         #wsmax: 50.0                                              # maximum sinking velocity [m d-1; default=50.0]
         #wsscale: 5000.0                                          # length scale of sinking [m; default=5000.0]
         #solgoc: 1.07868603E-01                                   # fraction broken down to smaller POM [dimensionless; default=1.07868603E-01]
         #mlvar: false                                             # lability varies in mixing layer [default=false]
         #xremip: 0.035                                            # remineralisation rate [dimensionless; default=0.035]
         #jcpoc: 15                                                # number of lability classes [default=15]
         #rshape: 1.0                                              # shape of the gamma function [dimensionless; default=1.0]
      initialization:
         c: 1.e-8                                                 # carbon concentration [mol C L-1; min=0.0; default=5.23000000E-08]
         fe: 5.e-14                                               # iron concentration [mol Fe L-1; min=0.0; default=9.84000000E-13]
         cal: 1.e-8                                               # calcite concentration [mol C L-1; min=0.0; default=1.04000000E-08]
         si: 5.e-14                                               # silicon concentration [mol Si L-1; min=0.0; default=1.53000000E-08]
      coupling:
         bc: fish/det_pool_c                                      # target pool for organic carbon depositon [mmol C m-2; default=]
         fer: fer/fe                                              # iron [mol C L-1; default=]
         sed: sed                                                 # sed
         dom: dom                                                 # dom
         spom: pom                                                # spom
   phy:
      model: pisces/phytoplankton                                 # model type [default=phy]
      long_name: nanophytoplankton                                # descriptive name for model instance [default=phy]
      parameters:
         #diatom: false                                            # use silicate [default=false]
         calcify: true                                            # calcify [default=false]
         #mumax0: 0.8                                              # maximum growth rate at 0 degrees Celsius [d-1; default=0.8]
         #bp: 1.066                                                # Temperature sensitivity of growth [dimensionless; default=1.066]
         #logbp: 6.39133257E-02                                    # Temperature sensitivity of growth (log rate, overwrites bp if given explicitely) [dimensionless; default=6.39133257E-02]
         #fpday: 1.5                                               # day-length factor for growth [dimensionless; default=1.5]
         #bresp: 0.033                                             # basal respiration [d-1; default=0.033]
         #pislope_s: 2.0                                           # P-I slope for small cells [g C (g Chl)-1 (W m-2)-1 d-1; default=2.0]
         #pislope_l: 2.0                                           # P-I slope for large cells [g C (g Chl)-1 (W m-2)-1 d-1; default=2.0]
         #xadap: 0.0                                               # acclimation factor to low light [dimensionless; default=0.0]
         #excret: 0.05                                             # fraction of production that is excreted [fraction; default=0.05]
         beta1: 1.85                                              # absorption in blue part of the light [fraction]
         beta2: 0.69                                              # absorption in green part of the light [fraction]
         beta3: 0.46                                              # absorption in red part of the light [fraction]
         concnh4: 1.e-7                                           # minimum half-saturation constant for ammonium (nitrogen units multiplied with C:N ratio of biomass) [mol C L-1]
         concno3: 1.e-6                                           # minimum half-saturation constant for nitrate (nitrogen units multiplied with C:N ratio of biomass) [mol C L-1]
         concfer: 1.e-9                                           # minimum half-saturation constant for iron uptake [mol Fe L-1]
         #xsizer: 3.0                                              # size ratio [dimensionless; default=3.0]
         #qfelim: 7.00000000E-06                                   # optimal iron quota [mol Fe (mol C)-1; default=7.00000000E-06]
         #fecm: 4.00000000E-05                                     # maximum iron quota [mol Fe (mol C)-1; default=4.00000000E-05]
         chlcm: 0.033                                             # maximum Chl / C ratio [g Chl (g C)-1]
         #chlcmin: 3.30000000E-03                                  # minimum Chl / C ratio [g Chl (g C)-1; default=3.30000000E-03]
         #xsize: 1.00000000E-06                                    # threshold concentration for size dependency (biomass above this threshold consists of large cells) [mol C L-1; default=1.00000000E-06]
         xmort: 1e-8                                              # threshold concentration for mortality [mol C L-1]
         #wchl: 0.01                                               # quadratic mortality [d-1 (umol C L-1)-1; default=0.01]
         #wchlm: 0.0                                               # maximum additional quadratic mortality due to nutrient limitation [d-1 (umol C L-1)-1; default=0.0]
         #mprat: 0.01                                              # mortality [d-1; default=0.01]
         #xkmort: 2.00000000E-07                                   # half saturation constant for mortality [mol C L-1; default=2.00000000E-07]
         #caco3r: 0.3                                              # mean rain ratio [fraction; default=0.3]
      initialization:
         c: 1.e-8                                                 # carbon [mol C L-1; min=0.0; default=0.0]
         ch: 2.1818e-9                                            # chlorophyll [g Chl L-1; min=0.0; default=0.0]
         fe: 5.e-14                                               # iron [mol Fe L-1; min=0.0; default=0.0]
      coupling:
         zstrn: daylength/zstrn                                   # day length [h; default=]
         heup_01: optics/heup_01                                  # euphotic layer depth (PAR > 0.5 W m-2) [m; default=]
         pe1: optics/pe1                                          # daily mean PAR in blue waveband [W m-2; default=]
         pe2: optics/pe2                                          # daily mean PAR in green waveband [W m-2; default=]
         pe3: optics/pe3                                          # daily mean PAR in red waveband [W m-2; default=]
         etot_ndcy: optics/etot_ndcy                              # daily mean PAR [W m-2; default=]
         no3: no3/c                                               # nitrate [mol C L-1; default=]
         nh4: nh4/c                                               # ammonium [mol C L-1; default=]
         po4: po4/c                                               # phosphate [mol C L-1; default=]
         biron: fer/fe                                            # bioavailable iron [mol Fe L-1; default=]
         doc: dom/c                                               # dissolved organic carbon [mol C L-1; default=]
         oxy: oxy/O2                                              # oxygen [mol O2 L-1; default=]
         fer: fer/fe                                              # iron [mol Fe L-1; default=]
         pom: pom                                                 # pom
         gom: gom                                                 # gom
   dia:
      model: pisces/phytoplankton                                 # model type [default=dia]
      long_name: diatoms                                          # descriptive name for model instance [default=dia]
      parameters:
         diatom: true                                             # use silicate [default=false]
         #calcify: false                                           # calcify [default=false]
         #mumax0: 0.8                                              # maximum growth rate at 0 degrees Celsius [d-1; default=0.8]
         #bp: 1.066                                                # Temperature sensitivity of growth [dimensionless; default=1.066]
         #logbp: 6.39133257E-02                                    # Temperature sensitivity of growth (log rate, overwrites bp if given explicitely) [dimensionless; default=6.39133257E-02]
         #fpday: 1.5                                               # day-length factor for growth [dimensionless; default=1.5]
         #bresp: 0.033                                             # basal respiration [d-1; default=0.033]
         #pislope_s: 2.0                                           # P-I slope for small cells [g C (g Chl)-1 (W m-2)-1 d-1; default=2.0]
         #pislope_l: 2.0                                           # P-I slope for large cells [g C (g Chl)-1 (W m-2)-1 d-1; default=2.0]
         #xadap: 0.0                                               # acclimation factor to low light [dimensionless; default=0.0]
         #excret: 0.05                                             # fraction of production that is excreted [fraction; default=0.05]
         beta1: 1.62                                              # absorption in blue part of the light [fraction]
         beta2: 0.74                                              # absorption in green part of the light [fraction]
         beta3: 0.63                                              # absorption in red part of the light [fraction]
         concnh4: 3.e-7                                           # minimum half-saturation constant for ammonium (nitrogen units multiplied with C:N ratio of biomass) [mol C L-1]
         concno3: 3.e-6                                           # minimum half-saturation constant for nitrate (nitrogen units multiplied with C:N ratio of biomass) [mol C L-1]
         #concsil: 1.00000000E-06                                  # minimum half-saturation constant for silicate uptake [mol Si L-1; default=1.00000000E-06]
         #xksilim: 1.65000000E-05                                  # parameter for the half-saturation constant for silicate uptake [mol Si L-1; default=1.65000000E-05]
         #xksi1: 2.00000000E-06                                    # parameter 1 for Si / C [mol Si L-1; default=2.00000000E-06]
         #xksi2: 2.00000000E-05                                    # parameter 2 for Si / C [mol Si L-1; default=2.00000000E-05]
         concfer: 3.e-9                                           # minimum half-saturation constant for iron uptake [mol Fe L-1]
         #xsizer: 3.0                                              # size ratio [dimensionless; default=3.0]
         #grosip: 0.159                                            # optimal Si / C uptake ratio [mol Si/mol C; default=0.159]
         #qfelim: 7.00000000E-06                                   # optimal iron quota [mol Fe (mol C)-1; default=7.00000000E-06]
         #fecm: 4.00000000E-05                                     # maximum iron quota [mol Fe (mol C)-1; default=4.00000000E-05]
         chlcm: 0.05                                              # maximum Chl / C ratio [g Chl (g C)-1]
         #chlcmin: 3.30000000E-03                                  # minimum Chl / C ratio [g Chl (g C)-1; default=3.30000000E-03]
         #xsize: 1.00000000E-06                                    # threshold concentration for size dependency (biomass above this threshold consists of large cells) [mol C L-1; default=1.00000000E-06]
         xmort: 1e-9                                              # threshold concentration for mortality [mol C L-1]
         #wchl: 0.01                                               # quadratic mortality [d-1 (umol C L-1)-1; default=0.01]
         wchlm: 0.03                                              # maximum additional quadratic mortality due to nutrient limitation [d-1 (umol C L-1)-1; default=0.0]
         #mprat: 0.01                                              # mortality [d-1; default=0.01]
         #xkmort: 2.00000000E-07                                   # half saturation constant for mortality [mol C L-1; default=2.00000000E-07]
      initialization:
         c: 1.e-8                                                 # carbon [mol C L-1; min=0.0; default=0.0]
         ch: 2.1818e-9                                            # chlorophyll [g Chl L-1; min=0.0; default=0.0]
         fe: 5.e-14                                               # iron [mol Fe L-1; min=0.0; default=0.0]
         si: 0.15e-8                                              # silicon [mol Si L-1; min=0.0; default=0.0]
      coupling:
         zstrn: daylength/zstrn                                   # day length [h; default=]
         heup_01: optics/heup_01                                  # euphotic layer depth (PAR > 0.5 W m-2) [m; default=]
         pe1: optics/pe1                                          # daily mean PAR in blue waveband [W m-2; default=]
         pe2: optics/pe2                                          # daily mean PAR in green waveband [W m-2; default=]
         pe3: optics/pe3                                          # daily mean PAR in red waveband [W m-2; default=]
         etot_ndcy: optics/etot_ndcy                              # daily mean PAR [W m-2; default=]
         no3: no3/c                                               # nitrate [mol C L-1; default=]
         nh4: nh4/c                                               # ammonium [mol C L-1; default=]
         po4: po4/c                                               # phosphate [mol C L-1; default=]
         biron: fer/fe                                            # bioavailable iron [mol Fe L-1; default=]
         sil: sil/si                                              # silicate [mol Si L-1; default=]
         doc: dom/c                                               # dissolved organic carbon [mol C L-1; default=]
         oxy: oxy/O2                                              # oxygen [mol O2 L-1; default=]
         pom: pom                                                 # pom
         gom: gom                                                 # gom
   carbonate:
      model: pisces/carbonate_chemistry                           # model type [default=carbonate]
      coupling:
         po4: po4/c                                               # phosphate [mol C L-1; default=]
         sil: sil/si                                              # silicate [mol Si L-1; default=]
   oxy:
      model: pisces/oxygen                                        # model type [default=oxy]
      long_name: oxygen                                           # descriptive name for model instance [default=oxy]
      #parameters:
         #oxymin: 1.00000000E-06                                   # half-saturation constant for anoxia [mol O2 L-1; default=1.00000000E-06]
   daylength:
      model: pisces/daylength                                     # model type [default=daylength]
   turbocline:
      model: pisces/turbocline                                    # model type [default=turbocline]
      #parameters:
         #avt_c: 5.00000000E-04                                    # critical vertical diffusivity [m2 s-1; default=5.00000000E-04]
         #minh: 10.0                                               # minimum thickness [m; default=10.0]
   shear:
      model: pisces/shear                                         # model type [default=shear]
   zoo:
      model: pisces/zooplankton                                   # model type [default=zoo]
      long_name: microzooplankton                                 # descriptive name for model instance [default=zoo]
      parameters:
         epsher: 0.3                                              # maximum growth efficiency [fraction; min=0.0; max=1.0]
         epshermin: 0.3                                           # minimum growth efficiency [fraction; min=0.0; max=1.0]
         #unass: 0.3                                               # non-assimilated fraction [fraction; min=0.0; max=1.0; default=0.3]
         #sigma: 0.6                                               # excretion as dissolved organic matter [fraction; min=0.0; max=1.0; default=0.6]
         grazrat: 3                                               # maximum grazing rate [d-1; min=0.0]
         #bz: 1.079                                                # Temperature sensitivity of grazing rate [dimensionless; default=1.079]
         #logbz: 7.60346863E-02                                    # Temperature sensitivity of grazing rate (log rate, overwrites bz if given explicitely) [dimensionless; default=7.60346863E-02]
         grazflux: 0                                              # flux-feeding rate [(m mol C L-1)-1; min=0.0]
         #xkgraz: 2.00000000E-05                                   # half-saturation constant for grazing [mol C L-1; min=0.0; default=2.00000000E-05]
         xprefn: 1.                                               # preference for nanophytoplankton [dimensionless; min=0.0]
         xprefd: 0.5                                              # preference for diatoms [dimensionless; min=0.0]
         xprefz: 0                                                # preference for microzooplankton [dimensionless; min=0.0]
         xprefc: 0.1                                              # preference for particulate organic carbon [dimensionless; min=0.0]
         #xthresh: 3.00000000E-07                                  # food threshold [mol C L-1; min=0.0; default=3.00000000E-07]
         #xthreshdia: 1.00000000E-08                               # food threshold for diatoms [mol C L-1; min=0.0; default=1.00000000E-08]
         #xthreshphy: 1.00000000E-08                               # food threshold for nanophytoplankton [mol C L-1; min=0.0; default=1.00000000E-08]
         #xthreshzoo: 1.00000000E-08                               # food threshold for microzooplankton [mol C L-1; min=0.0; default=1.00000000E-08]
         #xthreshpoc: 1.00000000E-08                               # food threshold for particulate organic carbon [mol C L-1; min=0.0; default=1.00000000E-08]
         mzrat: 0.004                                             # quadratic mortality [(umol C L-1)-1 d-1; min=0.0]
         resrat: 0.03                                             # linear mortality [d-1; min=0.0]
         #xkmort: 2.00000000E-07                                   # half saturation constant for mortality [mol C L-1; min=0.0; default=2.00000000E-07]
         part: 0.5                                                # fraction of calcite that does not dissolve in guts [fraction; min=0.0; max=1.0]
         #ferat: 1.00000000E-05                                    # Fe / C ratio [mol Fe mol C-1; min=0.0; default=1.00000000E-05]
         #xsizedia: 1.00000000E-06                                 # maximum accessible diatom biomass (above this threshold cells are too large) [mol C L-1; min=0.0; default=1.00000000E-06]
         xdismort: 0                                              # fraction of quadratic mortality directed to nutrient pools [fraction; min=0.0; max=1.0; default=5.71428571E-01]
         phlim: 1                                                 # relative grazing on nanophytoplankton if cells are small [fraction; min=0.0; max=1.0]
      initialization:
         c: 1.0e-8                                                # carbon [mol C L-1; min=0.0; default=0.0]
      coupling:
         no3: no3/c                                               # nitrate [mol C L-1; default=]
         nh4: nh4/c                                               # ammonium [mol C L-1; default=]
         po4: po4/c                                               # phosphate [mol C L-1; default=]
         fer: fer/fe                                              # iron [mol Fe L-1; default=]
         oxy: oxy/O2                                              # oxygen [mol O2 L-1; default=]
         doc: dom/c                                               # dissolved organic carbon [mol C L-1; default=]
         pos_waste: gom/si                                        # particulate silicon waste [mol Si L-1; default=]
         zoo: zoo/c                                               # microzooplankton [mol C L-1; default=]
         nitrfac: oxy/nitrfac                                     # denitrification factor computed from O2 levels [fraction; default=]
         waste: pom                                               # waste
         dia: dia                                                 # dia
         phy: phy                                                 # phy
         pom: pom                                                 # pom
         gom: gom                                                 # gom
   mes:
